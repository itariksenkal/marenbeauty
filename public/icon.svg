<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Maren Beauty">
  <!--
    The site mark.

    Deliberately NOT a letterform: an SVG favicon carrying text depends on a
    font the operating system happens to have, and Fraunces is not one of
    those — the "M" would render in whatever serif the machine substitutes,
    which is the same failure the Turkish glyph gate exists to prevent.

    Two settling arcs on the cream surface instead. The sea reference in
    docs/BRIEF.md §2 lives in behaviour and pacing, never in depiction — no
    wave illustration, no shell, no anchor. This is the least literal form of
    it that still reads as one shape at 16px.

    Colours are the palette primitives from src/styles/theme.css:
    --mb-cream, --mb-rosewood, --mb-clay. A unit test asserts they match.
  -->
  <rect width="64" height="64" rx="14" fill="#faf4ec" />
  <path
    d="M12 40c5-6 9-6 14 0s9 6 14 0 9-6 12-2"
    fill="none"
    stroke="#8a5d55"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <path
    d="M12 28c5-6 9-6 14 0s9 6 14 0 9-6 12-2"
    fill="none"
    stroke="#7c564c"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.45"
  />
</svg>
